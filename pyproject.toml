[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesils"
version = "0.1.0"
description = "LLM-driven SILS verification agent for ISO 26262 functional safety (AEB case study)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0", "Jinja2>=3.1", "Markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "pythonfmu>=0.6"]
fmu = ["fmpy>=0.3.20"]
agent = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-ollama>=0.2"]
openai = ["langchain-openai>=0.2"]
pdf = ["weasyprint>=60"]

[project.scripts]
safesils = "safesils.cli:main"

[tool.setuptools.packages.find]
include = ["safesils*"]

[tool.setuptools.package-data]
safesils = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
