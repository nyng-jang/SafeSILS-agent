name: SILS regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GNU Octave (MATLAB code back-to-back)
        run: sudo apt-get update -q && sudo apt-get install -y -q octave-no-gui || sudo apt-get install -y -q octave
      - run: pip install -e ".[dev,fmu]"
      - run: pytest -q
      - name: Run baseline scenarios
        run: safesils run scenarios/baseline --db out/results.db --no-signals --strict
